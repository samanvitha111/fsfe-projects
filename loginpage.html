 <!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
</head>
<body align="center">

  <h2>Login Page</h2>

  <form>
    <!-- Username Field -->
    <input type="text" name="g1" placeholder="Username or email" autofocus required> <br><br>

    <!-- Password Field (changed type to password to hide dots) -->
    <input type="password" name="g2" placeholder="Password" required> <br><br>

    <!-- Remember Me & Login Button -->
    <input type="checkbox" name="g3"> Remember me &nbsp;&nbsp;&nbsp;
    <button type="submit" name="g4" style="background-color: #4285f4; color: white; border: none; padding: 6px 16px;">LOGIN</button> <br><br>

    <!-- Register & Forgot Password Links -->
    <a href="#">Register now</a> &nbsp;&nbsp;&nbsp;
    <a href="#">Forgot password?</a> <br><br>

    <p>or</p>

    <!-- Social Login Buttons -->
    <button type="button" style="background-color: #3b5998; color: white; border: none; padding: 8px 20px; width: 200px;">LOGIN WITH FACEBOOK</button> <br><br>
    <button type="button" style="background-color: #1da1f2; color: white; border: none; padding: 8px 20px; width: 200px;">LOGIN WITH TWITTER</button> <br><br>
    <button type="button" style="background-color: #db4437; color: white; border: none; padding: 8px 20px; width: 200px;">LOGIN WITH GOOGLE</button>
  </form>

</body>
</html>
