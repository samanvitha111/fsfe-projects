
<html>
    <head>
        <style>
            body {background-color: powderblue;}
            h1 {color:blue;}
            p {color:red;}
        
        </style>
    </head>
    <body>
        <h1>this is a heading </h1>
        <p>this is a paragraph </p>

    </body>
</html>

    the css rule set should be within the HTML file in the head section .
    the css embedded within the stylel tag inside the head section of the html file -->

    <!--how to identify?
    if style is used as a tag it is an embedded or internal css
